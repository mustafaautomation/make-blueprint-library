name: Validate blueprints

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest tests/test_validator.py
      - name: Rebuild and confirm committed files match
        run: |
          python scripts/build_library.py
          git diff --exit-code
      - name: Structural validation
        run: python scripts/validate_blueprints.py --min 100
